# F2.6 — a single-page app, not a set of files. Every path that is not an
# actual static asset falls through to index.html so client-side routing
# (react-router-dom) can take over; without this, a hard refresh or a shared
# link on any route but "/" is a 404 from nginx before React ever runs.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Regenerated by docker-entrypoint.d/40-vni-runtime-config.sh on every
    # container start — never let a proxy or the browser cache a stale one.
    location = /env-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
