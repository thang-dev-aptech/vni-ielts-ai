# The production shape, runnable locally.
#
# <b>Not a deployment target — a smoke test you can run.</b> The production
# configuration path had never been executed before 2026-08-28: there was no
# Dockerfile, so nothing had ever booted with `ASPNETCORE_ENVIRONMENT=Production`
# and the startup gate, the object-storage adapter and the SMTP sender were all
# code nobody had run in the mode they exist for.
#
# What this is for is finding that class of problem before a deploy does. Point
# it at the local stack, bring it up, and the two images either start or say
# exactly what is missing.
#
#   docker compose -f infra/docker/compose.yaml up -d
#   docker compose -f infra/docker/compose.production.yaml up --build
#
# <b>Every secret here is a placeholder and every one of them is refused in a
# real deployment.</b> `Jwt__SigningKey` must come from the environment; the
# value below is long enough to pass the length check and is not a secret,
# which is the point — a file that could be copied into production is a file
# that will be.

name: vni-ielts-production-smoke

services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      # Placeholder. A real deployment supplies this from a secret store.
      Jwt__SigningKey: ${VNI_JWT_SIGNING_KEY:?set VNI_JWT_SIGNING_KEY before running this}

      Cors__Origins__0: http://localhost:5173
      Cors__Origins__1: http://localhost:5174

      # `host.docker.internal` reaches the local stack from inside the
      # container. A real deployment names a service, not a host.
      Mongo__ConnectionString: mongodb://host.docker.internal:27018/?directConnection=true
      Mongo__Database: vni_ielts_production_smoke

      ObjectStorage__ServiceUrl: http://host.docker.internal:9000
      ObjectStorage__AccessKey: vni-local
      ObjectStorage__SecretKey: vni-local-dev-only

      # No mail leaves this. The host does not resolve, so the sender reports
      # `NotSent` and every screen says so — which is the behaviour being
      # exercised, not a workaround.
      Email__Host: smtp.invalid
      Email__FromAddress: no-reply@vni.invalid
      Email__ClientBaseUrl: http://localhost:5173
    ports:
      - '18080:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Production
      Mongo__ConnectionString: mongodb://host.docker.internal:27018/?directConnection=true
      Mongo__Database: vni_ielts_production_smoke

      # The reconciliation sweep is off unless switched on, everywhere. A
      # background process that deletes audio is not something a smoke test
      # should enable. → `I2.5`
      Recordings__SweepEnabled: 'false'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
