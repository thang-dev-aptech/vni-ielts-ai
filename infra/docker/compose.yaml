# Local development stack.
#
# Mongo runs as a SINGLE-NODE REPLICA SET (rs0), not a standalone node.
#
# This is remedy (a) for H-10. nfr.md specifies a "single MongoDB instance",
# but MongoDB supports multi-document transactions only on a replica set — and
# debiting the token ledger while creating an exam session must be atomic or an
# aggressive mobile retry debits twice (threat T22).
#
# The trap is that on a standalone node the code WORKS in development. The
# failure only appears under retry concurrency, which mobile clients generate
# by design. Running rs0 everywhere costs one process and one flag, and makes
# transactions behave identically in every environment.
#
# Remedy (b) — designing deduction as one atomic update on a single ledger
# document — is a code decision and is done regardless. Both, not either.
#
# → docs/database/strategy-mongodb-to-postgresql.md § H-10

name: vni-ielts

services:
  mongo:
    image: mongo:7
    container_name: vni-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      # 27018 on the HOST, not 27017.
      #
      # A Homebrew mongodb-community was found bound to 127.0.0.1:27017 on this
      # machine (running since 6 Aug). Docker binds 0.0.0.0, and 127.0.0.1 is
      # the more specific match, so `localhost:27017` silently resolved to the
      # Homebrew standalone instead of this container.
      #
      # Everything appeared to work — register, login, refresh rotation, reuse
      # detection all passed against it. But a standalone node has no
      # transactions, so token deduction would have been non-atomic in
      # production and the failure would only have shown up under the retry
      # concurrency mobile clients generate by design.
      #
      # This is trap T2 from the master plan, and the same shadowing pattern as
      # R11. The port move avoids the collision; the startup guard in
      # DependencyInjection.InitialiseInfrastructureAsync is what actually
      # prevents a recurrence. → R15
      #
      # <b>F1.5 — bound to loopback only, not `0.0.0.0`.</b> Without a host
      # IP, Docker publishes on every interface — confirmed on this machine
      # via `docker port vni-mongo`, which showed `0.0.0.0:27018` and
      # `[::]:27018` before this fix. This Mongo runs with no authentication
      # configured (it is `--bind_ip_all` only *inside* the container, which
      # is what lets the Docker bridge network reach it at all — a separate
      # question from which host interface the published port answers on),
      # so on a shared network or a cloud dev box that was every other
      # machine on the segment holding a live, unauthenticated exam and
      # identity database.
      #
      # <b>Both loopback families, not just IPv4.</b> `127.0.0.1` alone was
      # tried first and broke `/health/ready` against the object-storage
      # container below: every connection string here says `localhost`,
      # which on this Windows machine resolves `::1` before `127.0.0.1`, and
      # a port with nothing bound on `::1` does not refuse the connection —
      # it hangs for the OS's full connect timeout (measured ~2.0s with
      # `curl -6`) before anything falls back to IPv4. That is longer than
      # the readiness probe's own 2-second deadline. Binding both addresses
      # means `localhost` resolves to a real listener on whichever family a
      # client tries first, with no silent multi-second stall either way.
      - '127.0.0.1:27018:27017'
      - '[::1]:27018:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run, then reports healthy once a
      # PRIMARY has been elected. Idempotent: re-running rs.initiate() on an
      # already-initiated set throws, which the catch swallows.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok } catch (e) {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok
          }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: vni-minio
    command: server /data --console-address ":9001"
    environment:
      # Local development only. Real credentials never enter this repository
      # and never enter a compose file. → CLAUDE.md rule 6
      MINIO_ROOT_USER: vni-local
      MINIO_ROOT_PASSWORD: vni-local-dev-only
    # F1.5 — loopback only, for the same reason as Mongo above: the root
    # credentials here are a fixed, committed, publicly-known local-dev
    # password, and `0.0.0.0` (Docker's default with no host IP given) would
    # have handed anyone on the same network a working S3-compatible store.
    # Both address families, for the same reason as Mongo's binding above —
    # this is in fact where that failure mode was originally found: the
    # object-storage readiness probe timed out at exactly 2.0s against an
    # IPv4-only loopback bind, because `localhost` tried `::1` first and
    # nothing was listening there to refuse it quickly.
    ports:
      - '127.0.0.1:9000:9000'
      - '[::1]:9000:9000'
      - '127.0.0.1:9001:9001'
      - '[::1]:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the buckets the application expects. Layout is BY RETENTION CLASS,
  # not by content type: PDPL storage limitation and data-subject deletion both
  # have to reach object storage, and a retention-shaped layout makes deletion
  # a policy on a prefix rather than a scan.
  # → docs/architecture/system-architecture.md § Object storage
  #
  # VERSIONING is enabled on three of the five, and the split is the point.
  #
  # Exam assets, packages and documents are AUTHORED content: an operator
  # re-uploading a package over a good one, or a bad bulk import, is the
  # realistic way they get destroyed — and versioning is the only thing that
  # makes that recoverable, because a mirror faithfully copies the damage.
  #
  # vni-audio-90d and vni-artifacts-2y are deliberately NOT versioned. They hold
  # learner speech and generated artefacts under a retention window, and a
  # version history is a copy that outlives the deletion it was supposed to
  # honour. Under PDPL a deleted recording has to actually be gone.
  # → docs/security/privacy-vietnam-pdpl.md, I6.6
  #
  # 2026-09-04: this per-class layout is the DEFAULT, not the only one. The
  # owner's R2 deployment uses one bucket with a folder per class
  # (ObjectStorage:*Prefix); the guards that protected the split moved into
  # the startup gate and the readiness probe. → docs/decisions/0016
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vni-local vni-local-dev-only &&
      mc mb --ignore-existing local/vni-audio-90d &&
      mc mb --ignore-existing local/vni-artifacts-2y &&
      mc mb --ignore-existing local/vni-exam-assets &&
      mc mb --ignore-existing local/vni-documents &&
      mc mb --ignore-existing local/vni-packages &&
      mc mb --ignore-existing local/vni-backups &&
      mc mb --ignore-existing local/vni-speaking &&
      mc version enable local/vni-exam-assets &&
      mc version enable local/vni-packages &&
      mc version enable local/vni-documents &&
      echo 'buckets ready'
      "

  # ── Continuous point-in-time backup ───────────────────────────────────────
  #
  # F3.3 — what `scripts/backup.sh` could not do. `mongodump --oplog` captures
  # only the operations that ran *during the dump*: a consistent snapshot, not
  # point-in-time recovery. Between two daily dumps there was nothing, so the
  # real recovery point was "the last full backup" — up to 24 hours. For an
  # exam product that is a learner's two-hour sitting, not a row in a table.
  #
  # `pbm-agent` slices the oplog continuously into the same S3-compatible
  # store, which is what makes an arbitrary restore instant possible at all.
  # → docs/development/backup-and-restore.md
  #
  # <b>`network_mode: service:mongo`, deliberately.</b> The agent is meant to
  # sit beside its own mongod, and this project's replica set advertises its
  # member as `localhost:27017` (ADR-0011, single-node). An agent in its own
  # namespace resolves that to itself and cannot see the database at all —
  # observed directly: `pbm status` failed with "connection refused" on
  # [::1]:27017 while the agent was otherwise healthy. Sharing mongo's network
  # namespace makes `localhost:27017` mean what rs.conf() says it means, with
  # no replica-set reconfiguration and no change to how the app connects.
  pbm:
    image: percona/percona-backup-mongodb:2.12.0
    container_name: vni-pbm
    command: ['pbm-agent']
    network_mode: 'service:mongo'
    environment:
      PBM_MONGODB_URI: 'mongodb://localhost:27017/?replicaSet=rs0'
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  minio-data:
