name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so this gate is real.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Called out separately from the rest of the suite because it is the one
      # rule the MongoDB to PostgreSQL migration depends on, and the one most
      # likely to decay quietly — violating it never breaks anything on the day
      # it happens. Failing it loudly and by name is the point.
      # → docs/decisions/0004-persistence-abstraction-boundary.md
      - name: Architecture boundary
        run: >
          dotnet test tests/Vni.Ielts.Architecture.Tests
          --no-build --configuration Release --logger 'console;verbosity=normal'

      - name: Unit tests
        run: >
          dotnet test tests/Vni.Ielts.Domain.Tests tests/Vni.Ielts.Application.Tests
          --no-build --configuration Release
